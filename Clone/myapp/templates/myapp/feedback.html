{% extends 'myapp/base.html' %}{% block title %}Feedback — VibeStream{% endblock %}{% block content %}<section class="section-block support-page feedback-page"><span class="eyebrow">HELP US IMPROVE</span><h2>Share your feedback</h2><p class="section-note">Report a bug, suggest a feature or tell us about your experience.</p><form method="post" action="{% url 'feedback_submit' %}" class="feedback-form">{% csrf_token %}<label for="feedback_type">Feedback type</label><select id="feedback_type" name="feedback_type"><option value="experience">General feedback</option><option value="bug">Report a bug</option><option value="idea">Suggest a feature</option></select><label for="rating">Rating</label><select id="rating" name="rating"><option value="5">5 — Excellent</option><option value="4">4 — Good</option><option value="3">3 — Okay</option><option value="2">2 — Poor</option><option value="1">1 — Very poor</option></select><label for="message">Your feedback</label><textarea id="message" name="message" rows="6" maxlength="2000" required placeholder="Tell us what happened or what we could improve…"></textarea><input type="hidden" name="page" value="{{ request.path }}"><button class="button button-primary" type="submit">Submit feedback ↗</button></form></section>{% endblock %}
